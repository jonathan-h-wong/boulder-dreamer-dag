pipeline:
  version: "0.1.0"   # informational (recorded in releases); cache keys track the real lineage

s3:
  bucket: "boulder-dreamer-dataset"
  region: "us-east-2"
  prefixes:
    # Inputs (written by the scraper; read-only to this pipeline)
    raw_videos: "raw/videos/"            # {post_id}_{item_id}.mp4  -> video_id = file stem
    raw_metadata: "raw/metadata/"        # {scrape_ts}_{gym_slug}.csv, one row per video_key
    # Outputs (siblings of raw/ and state/)
    filtered_videos: "filtered_videos/"
    hold_catalog: "hold_catalog/"
    processed: "processed/"
    manifests: "manifests/"              # immutable dataset releases ({release}.json)
    batches: "_batches/"                 # in-flight Claude batch records (resume on rerun)
    benchmarks: "_benchmarks/"           # model comparisons (scripts/benchmark_*.py)

filter:
  n_frames: 8                    # evenly spaced frames sent to the filter agent
  max_side_px: 768               # downscale long side (~450 image tokens per frame)
  jpeg_quality: 85
  max_camera_motion_px: 4.0       # reject if the wall shifts more than this between sampled
                                  # frames (px at max_side_px); applied at aggregation only

downsampling:
  # Aggressive downsampling for background plate and hold detection
  bkg_plate_rate: 10             # every Nth frame for per-video bkg plate
  bkg_plate_max_frames: 64       # stride grows past bkg_plate_rate to stay under this
  depth_rate: 5                  # every Nth frame for depth sampling
  keypose_rate: 1                # full sequence (GVHMR runs on all frames)

models:
  # Weights are cached on the Modal volume "boulderdreamer-weights" (see common/modal_images.py)
  moge3:
    checkpoint: "Ruicheng/moge-3-vitl"          # HF id; code pinned via MOGE_REF (vitg = larger)
  gvhmr:
    checkpoint_dir: "/weights/gvhmr"            # GVHMR checkpoints, uploaded manually
    body_models_dir: "/weights/body_models"     # SMPL / SMPL-X (licensed), uploaded manually
  sam2:
    checkpoint: "facebook/sam2.1-hiera-large"   # HF id
  marigold_v2:
    repo: "huawei-bayerlab/marigold-v2-0"       # HF id; code pinned via MARIGOLD_V2_REF
    checkpoint: "normals"                       # camera-space unit normals
    resolution: 1024                            # 2048 needs a ~32 GB GPU

hold_proposals:                  # SAM2 automatic masks -> numbered set-of-marks overlay
  max_side_px: 1920              # SAM2 + overlay resolution (only 4K plates are downscaled)
  points_per_side: 64
  crop_n_layers: 1               # extra zoomed passes so small footholds survive
  pred_iou_thresh: 0.8           # SAM2 defaults; lower both to raise recall
  stability_score_thresh: 0.95
  min_mask_area_px: 150          # at max_side_px resolution
  max_mask_area_frac: 0.2        # drop wall / floor / mat-sized masks
  nms_mask_iou: 0.7
  overlay_long_side_px: 2560     # overlay upscaled to this; labels stay a fixed pixel size
  tile_px: 1024                  # overlay tiles sent to the agent (API downscales big images)
  tile_overlap_px: 128

hold_contacts:                   # geometric on-route + volume mounting
  min_contact_frames: 5
  max_contact_speed_px: 3.0      # per frame, projected hand/foot point
  wall_depth_tol_m: 0.10
  mask_dilate_px: 6
  mount_min_containment: 0.6     # intersection / hold-bbox area (not IoU)

hold_catalog:
  max_farthest_point_samples: 50
  hdbscan_min_cluster_size: 5
  pca_components: 64

hold_fit:                        # jobs/hold_fit.py — shared by catalog + scenegraph
  min_score: 0.80                # accept threshold (IoU / normal agreement)
  loss_weights: {iou: 1.0, normal: 1.0, depth: 0.5, points: 1.0, reg: 0.1}
  window_margin_px: 8            # loss window = dilated hold mask minus non-fitted holds
  iterations: 300
  lr: 0.01

agents:                          # one section per agent stage; each stage hashes only its own
  filter_video:                  # easy yes/no judgments over 8 frames, all ~29.5k videos
    model: "claude-haiku-5-5"
    effort: "low"                # thinking depth; 5.5 models think adaptively, effort is the dial
    max_tokens: 4000             # truncation = failure (retried next run)
  # Set-of-marks hold perception, two passes. Haiku with this split beat Haiku single-pass
  # on detection and type agreement with Opus at ~1/15th of Opus' cost (scratch experiments
  # against the Opus-high reference, 20 plates, Nov 2026).
  detect_holds:                  # pass 1: one close-up per proposal -> which marks are holds
    model: "claude-haiku-5-5"
    effort: "medium"
    max_tokens: 16000
    closeup_px: 224              # each close-up's side; shown twice (photo | outlined)
    closeup_scale: 2.0           # window = 2x the mark's larger bbox side...
    closeup_min_px: 64           # ...but at least this many plate.jpg px
    max_missing_frac: 0.02       # skipped marks above this fraction fail the video (retried)
  extract_hold_descriptions:     # pass 2: whole plate at one scale -> fields per detected hold
    model: "claude-haiku-5-5"
    effort: "medium"
    max_tokens: 32000            # room for thinking + a description per hold (up to ~170)
  curate_hold_catalog:           # one shape-program request per cluster: hardest, fewest calls
    model: "claude-opus-5-5"
    effort: "high"
    max_tokens: 32000
