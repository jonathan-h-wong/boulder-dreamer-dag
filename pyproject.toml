[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boulderdreamer-dag"
version = "0.1.0"
description = "BoulderDreamer processing pipeline: video filtering, hold cataloging, and dataset production."
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "prefect>=3.0",
    "modal>=1.0",
    # Claude Batch API
    "anthropic>=0.40",
    # Data / compute
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "scipy",
    "scikit-learn",
    "hdbscan",
    "pydantic>=2.0",
    "pyyaml",
    # Storage
    "boto3",
    "s3fs",
    # DVC
    "dvc[s3]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "moto[s3]",   # tests/test_orchestration.py mocks S3
]

[tool.setuptools.packages.find]
include = ["agents*", "common*", "flows*", "jobs*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
